<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rehan Models – AI Studio</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0b0e14;
            color: #e0e6ed;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 560px;
            width: 100%;
            background: #141a24;
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #2a3344;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        h1 { color: #7fdbff; font-size: 26px; text-align: center; margin-bottom: 4px; }
        .sub { text-align: center; color: #6a7a94; font-size: 14px; margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #b0c4de; margin: 12px 0 4px; }
        input, select, textarea, button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #2a3344;
            background: #0f141e;
            color: #e0e6ed;
            font-size: 15px;
            font-family: inherit;
            margin-bottom: 4px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #7fdbff; }
        textarea { min-height: 80px; resize: vertical; }
        button {
            background: #7fdbff;
            color: #0b0e14;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover { background: #9febff; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            color: #8a9bb5;
            font-size: 14px;
            text-align: center;
            min-height: 30px;
            margin: 12px 0;
            word-break: break-word;
        }
        .step-detail {
            color: #ffb07c;
            font-size: 13px;
            text-align: center;
            margin: 4px 0;
            min-height: 20px;
        }
        .elapsed {
            color: #5a7a8a;
            font-size: 12px;
            text-align: center;
        }
        .progress {
            width: 100%;
            height: 6px;
            background: #2a3344;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress .fill {
            height: 100%;
            background: #7fdbff;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        video, img {
            width: 100%;
            max-height: 380px;
            border-radius: 12px;
            background: #000;
            display: none;
            margin-top: 12px;
            object-fit: contain;
        }
        img { background: #0f141e; }
        .text-output {
            background: #0f141e;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #2a3344;
            color: #e0e6ed;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
            margin-top: 12px;
            min-height: 100px;
        }
        .download-btn {
            background: #4a9eff;
            color: #fff;
            padding: 8px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            margin-top: 8px;
            width: auto;
        }
        .download-btn:hover { background: #6bb0ff; }
        .model-select { display: block; }
        .error-box {
            padding: 12px;
            background: #3a1a1a;
            border-radius: 12px;
            border: 1px solid #6b3a3a;
            color: #ffb3b3;
            font-size: 14px;
            display: none;
            margin-top: 8px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #5a6a84;
            margin-top: 20px;
        }
        .badge {
            display: inline-block;
            background: #1a2a3a;
            color: #7fdbff;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #2a4a5a;
        }
        .flex { display: flex; gap: 8px; flex-wrap: wrap; }
        .flex input { flex: 1; min-width: 60px; }
        .flex button { width: auto; margin-top: 0; }
        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .mode-toggle button {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #2a3344;
            background: #0f141e;
            color: #8a9bb5;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0;
        }
        .mode-toggle button.active {
            background: #1a2a3a;
            border-color: #7fdbff;
            color: #7fdbff;
        }
        .hidden { display: none; }
        .preset-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 4px 0 8px;
        }
        .preset-group button {
            flex: 1;
            min-width: 40px;
            padding: 6px 8px;
            font-size: 12px;
            background: #2a3344;
            color: #b0c4de;
            border: 1px solid #2a3344;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 0;
        }
        .preset-group button:hover { background: #3e4a60; }
        .preset-group button.active { border-color: #7fdbff; background: #1a2a3a; }
        .model-type-indicator {
            font-size: 13px;
            color: #ffb07c;
            text-align: center;
            margin-bottom: 8px;
        }
        .quality-select {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .quality-select button {
            flex: 1;
            min-width: 50px;
            padding: 6px 10px;
            font-size: 12px;
            background: #2a3344;
            color: #b0c4de;
            border: 1px solid #2a3344;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 0;
        }
        .quality-select button:hover { background: #3e4a60; }
        .quality-select button.active { border-color: #7fdbff; background: #1a2a3a; }
        .mode-options { margin-top: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 Rehan Models</h1>
    <div class="sub">AI Studio – Text • Image • Video</div>

    <!-- API Key -->
    <label>API Key</label>
    <input type="text" id="apiKey" placeholder="sk-..." value="sk-v3AY5kJOdHil90U8PcgqNCGYa39w3coiURlEAtbZBSmkSKCG">

    <!-- Mode Toggle -->
    <div class="mode-toggle">
        <button id="modeSimple" class="active" onclick="switchMode('simple')">📹 Simple</button>
        <button id="modeCreative" onclick="switchMode('creative')">🎬 Creative (Scenes)</button>
    </div>

    <!-- ============================================================ -->
    <!-- SIMPLE MODE -->
    <!-- ============================================================ -->
    <div id="simpleMode">
        <label>Prompt</label>
        <textarea id="prompt">a beautiful woman walking on a beach at sunset, cinematic, 4k</textarea>

        <!-- Model Type Selector -->
        <label>Model Type</label>
        <select id="modelSelect">
            <option value="text">📝 Rehan Text Model</option>
            <option value="image">🖼️ Rehan Image Model</option>
            <option value="video" selected>🎬 Rehan Video Model</option>
        </select>
        <div class="model-type-indicator" id="modelTypeIndicator">🎬 Video Mode</div>

        <!-- Video-specific options -->
        <div id="videoOptions" class="mode-options">
            <label>Duration</label>
            <div class="preset-group" id="durationPresets">
                <button data-dur="2">2s</button>
                <button data-dur="5" class="active">5s</button>
                <button data-dur="10">10s</button>
                <button data-dur="20">20s</button>
                <button data-dur="30">30s</button>
            </div>
            <input type="hidden" id="duration" value="5">

            <label>Quality</label>
            <div class="quality-select" id="videoQualityPresets">
                <button data-res="480p">480p</button>
                <button data-res="720p" class="active">720p</button>
                <button data-res="1080p">1080p</button>
                <button data-res="4K">4K</button>
            </div>
            <input type="hidden" id="resolution" value="720p">
        </div>

        <!-- Image-specific options -->
        <div id="imageOptions" class="mode-options" style="display:none;">
            <label>Image Size</label>
            <div class="quality-select" id="imageSizePresets">
                <button data-size="512x512">512²</button>
                <button data-size="768x768">768²</button>
                <button data-size="1024x1024" class="active">1024²</button>
                <button data-size="1536x1536">1536²</button>
            </div>
            <input type="hidden" id="imageSize" value="1024x1024">

            <label>Quality</label>
            <div class="quality-select" id="imageQualityPresets">
                <button data-quality="low">Low</button>
                <button data-quality="medium" class="active">Medium</button>
                <button data-quality="high">High</button>
                <button data-quality="4k">4K</button>
            </div>
            <input type="hidden" id="imageQuality" value="medium">
        </div>

        <!-- Text options (none needed) -->
        <div id="textOptions" class="mode-options" style="display:none;">
            <p style="font-size:13px;color:#5a7a8a;margin:4px 0;">Text generation uses the Agnes chat API.</p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- CREATIVE MODE (Auto-Generated Scenes) -->
    <!-- ============================================================ -->
    <div id="creativeMode" class="hidden">
        <label>Main Prompt (Idea)</label>
        <textarea id="creativeIdea">a guy fighting Thanos</textarea>

        <div class="flex">
            <div style="flex:1;">
                <label>Number of Scenes</label>
                <div class="preset-group" id="sceneCountSelect">
                    <button data-count="2">2</button>
                    <button data-count="3" class="active">3</button>
                    <button data-count="4">4</button>
                    <button data-count="5">5</button>
                    <button data-count="6">6</button>
                    <button data-count="8">8</button>
                    <button data-count="10">10</button>
                </div>
                <input type="hidden" id="sceneCount" value="3">
            </div>
            <div style="flex:1;">
                <label>Duration per Scene</label>
                <div class="preset-group" id="creativeDurationPreset">
                    <button data-dur="2">2s</button>
                    <button data-dur="5" class="active">5s</button>
                    <button data-dur="10">10s</button>
                    <button data-dur="20">20s</button>
                    <button data-dur="30">30s</button>
                </div>
                <input type="hidden" id="creativeDuration" value="5">
            </div>
        </div>

        <div class="creative-options">
            <label>Quality</label>
            <div class="quality-select" id="creativeQualityPresets">
                <button data-res="480p">480p</button>
                <button data-res="720p" class="active">720p</button>
                <button data-res="1080p">1080p</button>
                <button data-res="4K">4K</button>
            </div>
            <input type="hidden" id="creativeResolution" value="720p">

            <div class="flex">
                <input type="text" id="creativeStyle" value="cinematic realistic style" placeholder="Style">
            </div>
            <p style="font-size:12px;color:#5a7a8a;margin-top:4px;">
                The AI will automatically generate scenes based on your main prompt.
            </p>
        </div>
    </div>

    <!-- Generate Button -->
    <button id="generateBtn">Generate</button>

    <div class="status" id="status">● ready</div>
    <div class="step-detail" id="stepDetail"></div>
    <div class="elapsed" id="elapsedTime"></div>
    <div class="progress"><div class="fill" id="progressFill"></div></div>

    <!-- Output -->
    <video id="videoOutput" controls autoplay loop playsinline></video>
    <img id="imageOutput" alt="Generated image" />
    <div class="text-output" id="textOutput"></div>
    <div class="error-box" id="errorBox"></div>
    <button class="download-btn" id="downloadBtn">💾 Save</button>

    <div class="footer">
        <span class="badge">🔹 Powered by Rehan</span>
        <span style="margin-left:8px;">• Unlimited • Free</span>
    </div>
</div>

<script>
// ================================================================
//  REHAN MODELS – TEXT + IMAGE + VIDEO (FULLY WORKING)
// ================================================================

const apiKeyInput = document.getElementById('apiKey');
const promptInput = document.getElementById('prompt');
const modelSelect = document.getElementById('modelSelect');
const durationInput = document.getElementById('duration');
const resolutionInput = document.getElementById('resolution');
const imageSizeInput = document.getElementById('imageSize');
const imageQualityInput = document.getElementById('imageQuality');
const generateBtn = document.getElementById('generateBtn');
const statusDiv = document.getElementById('status');
const stepDetailDiv = document.getElementById('stepDetail');
const elapsedTimeDiv = document.getElementById('elapsedTime');
const progressFill = document.getElementById('progressFill');
const videoOutput = document.getElementById('videoOutput');
const imageOutput = document.getElementById('imageOutput');
const textOutput = document.getElementById('textOutput');
const downloadBtn = document.getElementById('downloadBtn');
const errorBox = document.getElementById('errorBox');
const modelTypeIndicator = document.getElementById('modelTypeIndicator');
const videoOptions = document.getElementById('videoOptions');
const imageOptions = document.getElementById('imageOptions');
const textOptions = document.getElementById('textOptions');

// Creative mode elements
const creativeIdea = document.getElementById('creativeIdea');
const creativeStyle = document.getElementById('creativeStyle');
const creativeResolution = document.getElementById('creativeResolution');
const sceneCountInput = document.getElementById('sceneCount');
const creativeDurationInput = document.getElementById('creativeDuration');
const modeSimple = document.getElementById('modeSimple');
const modeCreative = document.getElementById('modeCreative');
const simpleMode = document.getElementById('simpleMode');
const creativeMode = document.getElementById('creativeMode');

let isGenerating = false;
let stopPolling = false;
let startTime = null;
let currentMode = 'simple';
let currentModel = 'video';

// ============================================================
// MODEL SELECTION LOGIC
// ============================================================

modelSelect.addEventListener('change', function() {
    const val = this.value;
    currentModel = val;
    if (val === 'video') {
        videoOptions.style.display = 'block';
        imageOptions.style.display = 'none';
        textOptions.style.display = 'none';
        modelTypeIndicator.textContent = '🎬 Video Mode';
    } else if (val === 'image') {
        videoOptions.style.display = 'none';
        imageOptions.style.display = 'block';
        textOptions.style.display = 'none';
        modelTypeIndicator.textContent = '🖼️ Image Mode';
    } else {
        videoOptions.style.display = 'none';
        imageOptions.style.display = 'none';
        textOptions.style.display = 'block';
        modelTypeIndicator.textContent = '📝 Text Mode';
    }
});

// ============================================================
// PRESET HANDLING
// ============================================================

function setupPresets(containerSelector, inputId, className = 'active') {
    document.querySelectorAll(containerSelector + ' button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll(containerSelector + ' button').forEach(b => b.classList.remove(className));
            this.classList.add(className);
            const input = document.getElementById(inputId);
            if (input) input.value = this.dataset.dur || this.dataset.count || this.dataset.res || this.dataset.size || this.dataset.quality;
        });
    });
}

setupPresets('#durationPresets', 'duration');
setupPresets('#videoQualityPresets', 'resolution');
setupPresets('#imageSizePresets', 'imageSize');
setupPresets('#imageQualityPresets', 'imageQuality');
setupPresets('#sceneCountSelect', 'sceneCount');
setupPresets('#creativeDurationPreset', 'creativeDuration');
setupPresets('#creativeQualityPresets', 'creativeResolution');

// ============================================================
// MODE SWITCH
// ============================================================

function switchMode(mode) {
    currentMode = mode;
    if (mode === 'simple') {
        modeSimple.classList.add('active');
        modeCreative.classList.remove('active');
        simpleMode.classList.remove('hidden');
        creativeMode.classList.add('hidden');
    } else {
        modeCreative.classList.add('active');
        modeSimple.classList.remove('active');
        creativeMode.classList.remove('hidden');
        simpleMode.classList.add('hidden');
    }
    console.log('Mode switched to:', mode);
}

modeSimple.addEventListener('click', function() { switchMode('simple'); });
modeCreative.addEventListener('click', function() { switchMode('creative'); });

// ============================================================
// API HELPERS
// ============================================================

function setStatus(msg, isError = false) {
    statusDiv.textContent = msg;
    statusDiv.style.color = isError ? '#ff6b6b' : '#8a9bb5';
}

function setStepDetail(msg) {
    stepDetailDiv.textContent = msg || '';
}

function setElapsedTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    elapsedTimeDiv.textContent = `⏱️ ${mins}m ${secs}s elapsed`;
}

function setProgress(pct) {
    progressFill.style.width = Math.min(100, pct) + '%';
}

function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
}

function hideError() {
    errorBox.style.display = 'none';
}

function resetOutput() {
    videoOutput.style.display = 'none';
    imageOutput.style.display = 'none';
    textOutput.style.display = 'none';
    downloadBtn.style.display = 'none';
    videoOutput.src = '';
    imageOutput.src = '';
    textOutput.textContent = '';
}

function showVideo(url) {
    videoOutput.src = url;
    videoOutput.style.display = 'block';
    downloadBtn.style.display = 'inline-block';
    videoOutput.load();
    downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'video.mp4';
        document.body.appendChild(a);
        a.click();
        a.remove();
    };
}

function showImage(url) {
    imageOutput.src = url;
    imageOutput.style.display = 'block';
    downloadBtn.style.display = 'inline-block';
    downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'image.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
    };
}

function showText(text) {
    textOutput.textContent = text;
    textOutput.style.display = 'block';
    downloadBtn.style.display = 'inline-block';
    downloadBtn.onclick = () => {
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'text.txt';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    };
}

async function setApiKey(apiKey) {
    const resp = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ api_key: apiKey })
    });
    if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`Failed to set API key: ${err}`);
    }
    return true;
}

async function pollTask(taskId) {
    let videoUrl = null;
    let lastMessage = '';

    while (!stopPolling) {
        await new Promise(r => setTimeout(r, 3000));

        try {
            const resp = await fetch(`/api/tasks/${taskId}`);
            if (!resp.ok) continue;
            const data = await resp.json();

            const status = data.status || 'pending';
            const progress = data.progress || 0;
            const currentStep = data.current_step || '';
            const currentMessage = data.current_message || '';

            setProgress(10 + (progress * 0.9));

            let stepMsg = currentStep || currentMessage;
            if (stepMsg) {
                setStepDetail(`🔹 ${stepMsg}`);
                lastMessage = stepMsg;
            } else if (lastMessage) {
                // keep last message
            } else {
                setStepDetail('⏳ Processing...');
            }

            if (startTime) {
                const elapsed = (Date.now() - startTime) / 1000;
                setElapsedTime(elapsed);
            }

            setStatus(`⏳ Rendering... ${Math.round(progress)}%`);

            if (status === 'completed') {
                if (data.final_video_file) {
                    videoUrl = `/api/video/${taskId}`;
                } else {
                    const testResp = await fetch(`/api/video/${taskId}`, { method: 'HEAD' });
                    if (testResp.ok) {
                        videoUrl = `/api/video/${taskId}`;
                    }
                }
                if (videoUrl) break;
            } else if (status === 'failed') {
                throw new Error(data.error || 'Generation failed');
            }
        } catch (e) {
            console.warn('Poll error:', e);
            await new Promise(r => setTimeout(r, 2000));
        }
    }

    if (!videoUrl && !stopPolling) {
        throw new Error('Task did not complete.');
    }
    return videoUrl;
}

// ============================================================
// IMAGE GENERATION – FALLBACK TO POLLINATIONS
// ============================================================

async function generateImage(prompt, size, quality) {
    // Try the server endpoint first
    try {
        const resp = await fetch('/api/image/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                prompt: prompt,
                size: size || '1024x1024',
                quality: quality || 'medium'
            })
        });
        if (resp.ok) {
            const data = await resp.json();
            if (data.task_id) {
                // Poll for image
                let attempts = 0;
                while (attempts < 20) {
                    attempts++;
                    await new Promise(r => setTimeout(r, 2000));
                    const pollResp = await fetch(`/api/tasks/${data.task_id}`);
                    if (!pollResp.ok) continue;
                    const pollData = await pollResp.json();
                    if (pollData.status === 'completed' && pollData.final_video_file) {
                        return `/api/video/${data.task_id}`;
                    }
                }
                throw new Error('Image generation timed out.');
            }
            if (data.image_url) {
                return data.image_url;
            }
        }
    } catch (e) {
        console.warn('Server image endpoint failed:', e);
    }

    // FALLBACK: Pollinations (free, no key, works directly)
    const width = parseInt(size.split('x')[0]) || 1024;
    const height = parseInt(size.split('x')[1]) || 1024;
    // Adjust quality
    let qualityParam = '';
    if (quality === 'low') qualityParam = '&quality=low';
    else if (quality === 'high') qualityParam = '&quality=high';
    else if (quality === '4k') qualityParam = '&quality=4k';
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${width}&height=${height}&nologo=true&seed=${Math.floor(Math.random()*100000)}${qualityParam}`;
    return url;
}

// ============================================================
// MAIN GENERATE
// ============================================================

async function generateVideo() {
    if (isGenerating) return;

    const apiKey = apiKeyInput.value.trim();
    const modelType = modelSelect.value; // 'text', 'image', 'video'

    if (!apiKey) {
        setStatus('❌ Please enter your API key.', true);
        return;
    }

    resetOutput();
    hideError();
    setStepDetail('');
    setElapsedTime(0);
    startTime = Date.now();
    isGenerating = true;
    generateBtn.disabled = true;
    generateBtn.textContent = '⏳...';

    try {
        await setApiKey(apiKey);
        setProgress(5);
        setStatus('⏳ Processing...');

        if (modelType === 'text') {
            // TEXT
            const prompt = promptInput.value.trim() || 'Hello, how are you?';
            setStatus('⏳ Generating text...');
            const resp = await fetch('https://apihub.agnes-ai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + apiKey
                },
                body: JSON.stringify({
                    model: 'agnes-2.0-flash',
                    messages: [{ role: 'user', content: prompt }],
                    max_tokens: 500,
                    temperature: 0.7
                })
            });
            if (!resp.ok) {
                const err = await resp.text();
                throw new Error(`Text API error: ${err}`);
            }
            const data = await resp.json();
            const text = data.choices?.[0]?.message?.content || 'No response';
            setProgress(100);
            setStatus('✅ Text generated!');
            showText(text);
            return;
        }

        if (modelType === 'image') {
            // IMAGE
            const prompt = promptInput.value.trim();
            if (!prompt) {
                setStatus('❌ Please enter a prompt.', true);
                return;
            }
            const size = imageSizeInput.value || '1024x1024';
            const quality = imageQualityInput.value || 'medium';
            setStatus('⏳ Generating image...');
            const imageUrl = await generateImage(prompt, size, quality);
            setProgress(100);
            setStatus('✅ Image ready!');
            showImage(imageUrl);
            return;
        }

        // VIDEO
        const resolution = currentMode === 'simple'
            ? resolutionInput.value || '720p'
            : creativeResolution.value || '720p';
        let payload;
        let endpoint = '/api/tasks/simple';

        if (currentMode === 'simple') {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                setStatus('❌ Please enter a prompt.', true);
                return;
            }
            const duration = parseInt(durationInput.value) || 5;
            payload = {
                prompt: prompt,
                mode: 't2v',
                duration: duration,
                video_width: resolution === '1080p' ? 1920 : (resolution === '4K' ? 3840 : 1152),
                video_height: resolution === '1080p' ? 1080 : (resolution === '4K' ? 2160 : 768),
            };
        } else {
            // Creative mode
            const idea = creativeIdea.value.trim();
            if (!idea) {
                setStatus('❌ Please enter a main prompt.', true);
                return;
            }
            const sceneCount = parseInt(sceneCountInput.value) || 3;
            const sceneDuration = parseInt(creativeDurationInput.value) || 5;
            const style = creativeStyle.value.trim() || 'cinematic realistic style';

            endpoint = '/api/tasks/creative';
            payload = {
                idea: idea,
                creative_name: 'Rehan Creative Video',
                style: style,
                chaining_mode: 'keyframes',
                video_width: resolution === '1080p' ? 1920 : (resolution === '4K' ? 3840 : 1152),
                video_height: resolution === '1080p' ? 1080 : (resolution === '4K' ? 2160 : 768),
                duration_source: 'manual',
                scene_count: sceneCount,
                uniform_duration: true,
                scene_durations_json: JSON.stringify(Array(sceneCount).fill(sceneDuration)),
            };
        }

        setStatus('⏳ Submitting video task...');
        setProgress(10);

        const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams(payload)
        });

        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`Server error (${response.status}): ${errText}`);
        }

        const data = await response.json();
        setProgress(15);

        if (data.task_id) {
            const taskId = data.task_id;
            setStatus(`⏳ Task ${taskId} queued. Polling...`);
            const videoUrl = await pollTask(taskId);
            if (videoUrl) {
                setProgress(100);
                setStatus('✅ Video ready!');
                showVideo(videoUrl);
            } else {
                throw new Error('No video URL returned.');
            }
        } else {
            throw new Error('No task ID returned.');
        }
    } catch (err) {
        setStatus('❌ ' + err.message, true);
        showError(err.message);
        console.error(err);
    } finally {
        isGenerating = false;
        stopPolling = true;
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate';
        if (elapsedInterval) {
            clearInterval(elapsedInterval);
            elapsedInterval = null;
        }
    }
}

// ============================================================
// EVENTS
// ============================================================

generateBtn.addEventListener('click', generateVideo);
promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateVideo();
    }
});

// ============================================================
// INIT
// ============================================================

setStatus('● ready');
console.log('🎬 Rehan Models – Text, Image, Video loaded.');
</script>
