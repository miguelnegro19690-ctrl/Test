<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rehan Models – AI Video</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0b0e14;
            color: #e0e6ed;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 560px;
            width: 100%;
            background: #141a24;
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #2a3344;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        h1 { color: #7fdbff; font-size: 26px; text-align: center; margin-bottom: 4px; }
        .sub { text-align: center; color: #6a7a94; font-size: 14px; margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #b0c4de; margin: 12px 0 4px; }
        input, select, textarea, button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #2a3344;
            background: #0f141e;
            color: #e0e6ed;
            font-size: 15px;
            font-family: inherit;
            margin-bottom: 4px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #7fdbff; }
        textarea { min-height: 80px; resize: vertical; }
        button {
            background: #7fdbff;
            color: #0b0e14;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover { background: #9febff; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            color: #8a9bb5;
            font-size: 14px;
            text-align: center;
            min-height: 24px;
            margin: 12px 0;
        }
        .progress {
            width: 100%;
            height: 6px;
            background: #2a3344;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress .fill {
            height: 100%;
            background: #7fdbff;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        video {
            width: 100%;
            max-height: 380px;
            border-radius: 12px;
            background: #000;
            display: none;
            margin-top: 12px;
        }
        .download-btn {
            background: #4a9eff;
            color: #fff;
            padding: 8px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            margin-top: 8px;
            width: auto;
        }
        .download-btn:hover { background: #6bb0ff; }
        .model-select { display: block; }
        .error-box {
            padding: 12px;
            background: #3a1a1a;
            border-radius: 12px;
            border: 1px solid #6b3a3a;
            color: #ffb3b3;
            font-size: 14px;
            display: none;
            margin-top: 8px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #5a6a84;
            margin-top: 20px;
        }
        .badge {
            display: inline-block;
            background: #1a2a3a;
            color: #7fdbff;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #2a4a5a;
        }
        .flex { display: flex; gap: 8px; }
        .flex input { flex: 1; }
        .flex button { width: auto; margin-top: 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 Rehan Models</h1>
    <div class="sub">AI Video Generator</div>

    <!-- API Key -->
    <label>API Key</label>
    <input type="text" id="apiKey" placeholder="sk-..." value="sk-v3AY5kJOdHil90U8PcgqNCGYa39w3coiURlEAtbZBSmkSKCG">

    <!-- Prompt -->
    <label>Prompt</label>
    <textarea id="prompt">a beautiful woman walking on a beach at sunset, cinematic, 4k</textarea>

    <!-- Model Selection -->
    <div class="model-select">
        <label>Model</label>
        <select id="modelSelect">
            <option value="agnes-2.0-flash">Rehan Text Model</option>
            <option value="agnes-image-2.1-flash">Rehan Image Model</option>
            <option value="agnes-video-v2.0" selected>Rehan Video Model</option>
        </select>
        <p style="font-size:12px;color:#5a7a8a;margin:4px 0 8px;">
            ⚠️ Changing the model affects which AI engine is used. Keep default for video.
        </p>
    </div>

    <!-- Duration & Resolution -->
    <div class="flex">
        <input type="number" id="duration" value="5" placeholder="Duration (s)" min="1" max="30" style="flex:0 0 90px;">
        <input type="text" id="resolution" value="720p" placeholder="720p / 1080p">
    </div>

    <!-- Generate Button -->
    <button id="generateBtn">Generate Video</button>

    <div class="status" id="status">● ready</div>
    <div class="progress"><div class="fill" id="progressFill"></div></div>

    <!-- Video Output -->
    <video id="videoOutput" controls autoplay loop playsinline></video>
    <div class="error-box" id="errorBox"></div>
    <button class="download-btn" id="downloadBtn">💾 Save Video</button>

    <div class="footer">
        <span class="badge">🔹 Powered by Agnes API</span>
        <span style="margin-left:8px;">• Unlimited • Free</span>
    </div>
</div>

<script>
// ================================================================
//  AGNES VIDEO GENERATOR – WITH LONGER POLLING (5 MIN)
// ================================================================

const apiKeyInput = document.getElementById('apiKey');
const promptInput = document.getElementById('prompt');
const modelSelect = document.getElementById('modelSelect');
const durationInput = document.getElementById('duration');
const resolutionInput = document.getElementById('resolution');
const generateBtn = document.getElementById('generateBtn');
const statusDiv = document.getElementById('status');
const progressFill = document.getElementById('progressFill');
const videoOutput = document.getElementById('videoOutput');
const downloadBtn = document.getElementById('downloadBtn');
const errorBox = document.getElementById('errorBox');

let isGenerating = false;
let pollInterval = null;

function setStatus(msg, isError = false) {
    statusDiv.textContent = msg;
    statusDiv.style.color = isError ? '#ff6b6b' : '#8a9bb5';
}

function setProgress(pct) {
    progressFill.style.width = Math.min(100, pct) + '%';
}

function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
}

function hideError() {
    errorBox.style.display = 'none';
}

// ----- Set API Key on the server -----
async function setApiKey(apiKey) {
    const resp = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ api_key: apiKey })
    });
    if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`Failed to set API key: ${err}`);
    }
    return true;
}

// ----- Poll task status with better handling -----
async function pollTask(taskId) {
    let attempts = 0;
    const maxAttempts = 100; // 100 * 3s = 5 minutes
    let videoUrl = null;

    while (attempts < maxAttempts) {
        attempts++;
        await new Promise(r => setTimeout(r, 3000));

        try {
            const resp = await fetch(`/api/tasks/${taskId}`);
            if (!resp.ok) continue;
            const data = await resp.json();

            // data fields: status, progress, final_video_file, error
            const status = data.status || 'pending';
            const progress = data.progress || 0;
            setProgress(20 + (progress * 0.8));

            setStatus(`⏳ Rendering... ${Math.round(progress)}% (${attempts}/${maxAttempts})`);

            if (status === 'completed') {
                // Try to get the video URL
                if (data.final_video_file) {
                    videoUrl = `/api/video/${taskId}`;
                } else {
                    // fallback: try to see if video exists
                    const testResp = await fetch(`/api/video/${taskId}`, { method: 'HEAD' });
                    if (testResp.ok) {
                        videoUrl = `/api/video/${taskId}`;
                    }
                }
                if (videoUrl) break;
            } else if (status === 'failed') {
                throw new Error(data.error || 'Generation failed');
            }
        } catch (e) {
            // If the poll fails, we just continue – network hiccups are okay.
            console.warn('Poll error:', e);
        }
    }

    if (!videoUrl) {
        throw new Error('Timeout waiting for video (5 minutes). The task might still be running – check Railway logs.');
    }
    return videoUrl;
}

// ----- Main generate function -----
async function generateVideo() {
    if (isGenerating) return;

    const apiKey = apiKeyInput.value.trim();
    const prompt = promptInput.value.trim();
    const model = modelSelect.value;
    const duration = parseInt(durationInput.value) || 5;
    const resolution = resolutionInput.value.trim() || '720p';

    if (!apiKey) {
        setStatus('❌ Please enter your API key.', true);
        return;
    }
    if (!prompt) {
        setStatus('❌ Please enter a prompt.', true);
        return;
    }

    isGenerating = true;
    generateBtn.disabled = true;
    setStatus('⏳ Setting API key...');
    setProgress(5);
    hideError();
    videoOutput.style.display = 'none';
    downloadBtn.style.display = 'none';

    try {
        // 1. Send API key to server
        await setApiKey(apiKey);
        setStatus('⏳ Submitting task...');
        setProgress(10);

        // 2. Submit the generation task
        const response = await fetch('/api/tasks/simple', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                prompt: prompt,
                mode: 't2v',
                duration: duration,
                video_width: resolution === '1080p' ? 1920 : 1152,
                video_height: resolution === '1080p' ? 1080 : 768,
                model: model,
            })
        });

        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`Server error (${response.status}): ${errText}`);
        }

        const data = await response.json();
        setProgress(20);

        if (data.task_id) {
            const taskId = data.task_id;
            setStatus(`⏳ Task ${taskId} queued. Polling for completion...`);
            const videoUrl = await pollTask(taskId);
            setProgress(100);
            setStatus('✅ Video ready!');
            videoOutput.src = videoUrl;
            videoOutput.style.display = 'block';
            downloadBtn.style.display = 'inline-block';
            videoOutput.load();
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = videoUrl;
                a.download = 'video.mp4';
                document.body.appendChild(a);
                a.click();
                a.remove();
            };
        } else {
            throw new Error('No task ID returned.');
        }
    } catch (err) {
        setStatus('❌ ' + err.message, true);
        showError(err.message);
        console.error(err);
    } finally {
        isGenerating = false;
        generateBtn.disabled = false;
    }
}

// ----- Events -----
generateBtn.addEventListener('click', generateVideo);
promptInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateVideo();
    }
});

setStatus('● ready');
</script>
</body>
</html>
